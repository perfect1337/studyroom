openapi: 3.1.0
info:
  title: Notification Service API
  version: 1.0.0
  description: API for managing notification delivery and user notification settings.
servers:
  - url: /api/v1
paths:
  /notifications:
    get:
      summary: List user notifications
      description: Returns current notifications for the authenticated user.
      security:
        - bearerAuth: []
      parameters:
        - name: unread_only
          in: query
          description: If true, only unread notifications are returned.
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: A list of notifications.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /notifications/{notification_id}/read:
    patch:
      summary: Mark a notification as read
      description: Marks a notification as read for the authenticated user.
      security:
        - bearerAuth: []
      parameters:
        - name: notification_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Notification marked as read.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /notifications/settings:
    get:
      summary: Get notification settings
      description: Returns current notification preferences for the authenticated user.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Notification settings retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      summary: Update notification settings
      description: Updates the authenticated user's notification preferences.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNotificationSettingsRequest'
      responses:
        '200':
          description: Notification settings updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettings'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /internal/notifications/send:
    post:
      summary: Send a notification event
      description: Internal endpoint used by other services to publish a notification event. The notification is queued for asynchronous delivery and the request returns once the message is accepted.
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendNotificationRequest'
      responses:
        '202':
          description: Notification event accepted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /internal/users/sync:
    post:
      summary: Synchronize user metadata
      description: Internal endpoint for refreshing user references used by notification processing.
      security:
        - serviceToken: []
      responses:
        '204':
          description: User metadata sync accepted.
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceToken:
      type: apiKey
      in: header
      name: X-Service-Token
  schemas:
    Notification:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        type:
          type: string
        channel:
          type: string
          enum: [email, max, telegram, whatsapp]
        message:
          type: string
        status:
          type: string
          enum: [pending, sent, failed]
        is_read:
          type: boolean
        error:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
      required:
        - id
        - user_id
        - type
        - channel
        - message
        - status
        - created_at
    NotificationSettings:
      type: object
      properties:
        user_id:
          type: integer
        email_enabled:
          type: boolean
        max_enabled:
          type: boolean
        telegram_enabled:
          type: boolean
        whatsapp_enabled:
          type: boolean
        preferred_messenger:
          type: string
          enum: [null, "email", "max", "telegram", "whatsapp"]
          nullable: true
      required:
        - user_id
        - email_enabled
        - max_enabled
        - telegram_enabled
        - whatsapp_enabled
    UpdateNotificationSettingsRequest:
      type: object
      properties:
        email_enabled:
          type: boolean
        max_enabled:
          type: boolean
        telegram_enabled:
          type: boolean
        whatsapp_enabled:
          type: boolean
        preferred_messenger:
          type: string
          enum: [null, "email", "max", "telegram", "whatsapp"]
          nullable: true
    SendNotificationRequest:
      type: object
      properties:
        user_id:
          type: integer
        type:
          type: string
        message:
          type: string
      required:
        - user_id
        - type
        - message
  responses:
    BadRequest:
      description: Bad request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
          required:
            - code
            - message
      required:
        - error
