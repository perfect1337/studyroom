services:
  # ---------- User Service ----------
  postgres-users:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: study_room_users
      POSTGRES_USER: user_service
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD:-devpassword123}
    ports:
      - "5433:5432" # для локальных контрактных тестов (TEST_DATABASE_URL)
    volumes:
      - postgres_users_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_service -d study_room_users"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - studyroom-network

  user-service:
    build:
      context: ./user-service
    environment:
      PORT: 8081
      DATABASE_URL: postgres://user_service:${USERS_DB_PASSWORD:-devpassword123}@postgres-users:5432/study_room_users?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      NATS_URL: nats://nats:4222
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
    ports:
      - "8081:8081"
    depends_on:
      postgres-users:
        condition: service_healthy
      nats:
        condition: service_started
    networks:
      - studyroom-network
    restart: unless-stopped

  # ---------- Брокер событий (NATS) ----------
  # Сюда будут публиковать события user.created, contract.created и т.д.
  # (см. architecture-communication.mermaid) — остальные сервисы, когда появятся,
  # подключаются к nats:4222 в этой же сети.
  nats:
    image: nats:2-alpine
    ports:
      - "4222:4222"
    networks:
      - studyroom-network

  # ---------- Notification Service ----------
  postgres-notifications:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: study_room_notifications
      POSTGRES_USER: notification_service
      POSTGRES_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:-devpassword123}
    ports:
      - "5434:5432" # для локальных контрактных тестов (TEST_DATABASE_URL)
    volumes:
      - postgres_notifications_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification_service -d study_room_notifications"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - studyroom-network

  notification-service:
    build:
      context: ./notification-service
    environment:
      PORT: 8085
      DATABASE_URL: postgres://notification_service:${NOTIFICATIONS_DB_PASSWORD:-devpassword123}@postgres-notifications:5432/study_room_notifications?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      SERVICE_TOKEN: ${NOTIFICATIONS_SERVICE_TOKEN:-change-me-service-token}
      NATS_URL: nats://nats:4222
      # --- Яндекс SMTP: см. notification-service/README.md как получить пароль приложения ---
      SMTP_HOST: ${SMTP_HOST:-smtp.yandex.ru}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "8085:8085"
    depends_on:
      postgres-notifications:
        condition: service_healthy
      nats:
        condition: service_started
    networks:
      - studyroom-network
    restart: unless-stopped

  # ---------- Academic Service ----------
  postgres-academic:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: study_room_academic
      POSTGRES_USER: academic_service
      POSTGRES_PASSWORD: ${ACADEMIC_DB_PASSWORD:-devpassword123}
    ports:
      - "5435:5432" # для локальных контрактных тестов (TEST_DATABASE_URL)
    volumes:
      - postgres_academic_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academic_service -d study_room_academic"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - studyroom-network

  academic-service:
    build:
      context: ./academic-service
    environment:
      PORT: 8082
      DATABASE_URL: postgres://academic_service:${ACADEMIC_DB_PASSWORD:-devpassword123}@postgres-academic:5432/study_room_academic?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      NATS_URL: nats://nats:4222
      # Единственный синхронный HTTP-вызов Academic Service — проверка
      # "чьи дети" у parent (GET /parents/{id}/children), см.
      # internal/userclient. Всё остальное идёт через user_refs/события.
      USER_SERVICE_URL: http://user-service:8081
    ports:
      - "8082:8082"
    depends_on:
      postgres-academic:
        condition: service_healthy
      nats:
        condition: service_started
      user-service:
        condition: service_started
    networks:
      - studyroom-network
    restart: unless-stopped

  # ---------- CRM Service ----------
  postgres-crm:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: study_room_crm
      POSTGRES_USER: crm_service
      POSTGRES_PASSWORD: ${CRM_DB_PASSWORD:-devpassword123}
    ports:
      - "5436:5432" # для локальных контрактных тестов (TEST_DATABASE_URL)
    volumes:
      - postgres_crm_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm_service -d study_room_crm"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - studyroom-network

  crm-service:
    build:
      context: ./crm-service
    environment:
      PORT: 8084
      DATABASE_URL: postgres://crm_service:${CRM_DB_PASSWORD:-devpassword123}@postgres-crm:5432/study_room_crm?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      NATS_URL: nats://nats:4222
      # Секрет для проверки X-Tilda-Signature на POST /applications/webhook —
      # см. crm-service/README.md. Пусто по умолчанию = проверка подписи
      # выключена (годится только для локальной разработки).
      TILDA_WEBHOOK_SECRET: ${TILDA_WEBHOOK_SECRET:-}
    ports:
      - "8084:8084"
    depends_on:
      postgres-crm:
        condition: service_healthy
      nats:
        condition: service_started
    networks:
      - studyroom-network
    restart: unless-stopped

  # ---------- Следующие сервисы (заготовки — раскомментировать по мере реализации) ----------
  # (аналогично: postgres-contracts/contracts-service)

networks:
  studyroom-network:
    driver: bridge

volumes:
  postgres_users_data:
  postgres_notifications_data:
  postgres_academic_data:
  postgres_crm_data:
  # postgres_contracts_data: