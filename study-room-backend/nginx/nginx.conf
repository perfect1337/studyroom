# ---------- Rate limiting (защита от флуда/DDoS) ----------
# Зоны в shared memory самого nginx worker'а — отдельного хранилища
# (Redis и т.п.) не требуется, состояние живёт в памяти процесса nginx.
# 10m зоны хватает примерно на ~160k уникальных IP.
#
# api_general — общий лимит на все /api/* запросы: 20 запросов/сек на IP,
# с запасом на всплеск (burst) в 40 запросов, чтобы не резать легитимные
# параллельные запросы фронтенда (SPA обычно бьёт несколько эндпоинтов
# почти одновременно при загрузке страницы).
limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;

# api_auth — отдельный, более жёсткий лимит на /auth/* (логин, регистрация,
# сброс пароля) — это основная цель брутфорса/скликивания.
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;

# conn_perip — ограничение числа одновременных соединений с одного IP
# (защита от исчерпания worker_connections при флуде).
limit_conn_zone $binary_remote_addr zone=conn_perip:10m;

# Не отвечаем сразу 503 всем "залпом" — nodelay даёт обработать burst сразу,
# но сверх лимита всё равно режет. status 429 понятнее клиенту, чем 503.
limit_req_status 429;
limit_conn_status 429;

map $http_origin $cors_origin {
    default "";
    # Разрешённые источники фронтенда. ВАЖНО: раньше здесь было
    # `default $http_origin` — это отражало ЛЮБОЙ Origin обратно в
    # Access-Control-Allow-Origin в сочетании с Allow-Credentials:true,
    # то есть де-факто "разрешить cross-site запросы с cookie для любого
    # сайта в интернете" — классическая дыра CORS+credentials. Теперь
    # разрешены только явно перечисленные источники.
    "~^https://(www\.)?mestudyroom64\.ru$" $http_origin;
    "~^http://localhost(:[0-9]+)?$" $http_origin;
    "~^http://127\.0\.0\.1(:[0-9]+)?$" $http_origin;
}

# Обработка OPTIONS запросов
map $request_method $cors_method {
    OPTIONS 204;
    default 0;
}

server {
    listen 80 default_server;
    server_name mestudyroom64.ru www.mestudyroom64.ru;

    # Отдельная точка входа для ACME-валидации Let's Encrypt (certbot webroot).
    # Держим её на голом HTTP до всякого редиректа на https, иначе certbot
    # не сможет пройти challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Health-check оставляем доступным по HTTP без сертификата (для
    # балансировщиков/мониторинга, которым TLS не нужен).
    location /healthz {
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Всё остальное — на HTTPS. Раньше API отвечало и на голом HTTP,
    # без шифрования и с cookie (refresh-токен), которые могли улететь
    # в открытом виде, если фронтенд случайно постучится сюда.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name mestudyroom64.ru www.mestudyroom64.ru;

    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # ---------- API Locations ----------
    # user-service отдаёт несколько групп путей под /api/v1: /auth/*,
    # /users/*, /branches*, /parents/*, и ОТДЕЛЬНО /tutors/{id}/status
    # (см. user-service/internal/app/app.go). "tutors" раньше не было в
    # этом списке — PATCH /api/v1/tutors/{id}/status не попадал ни в один
    # location, проваливался в SPA-фоллбэк (location / ниже), а тот
    # обслуживает только GET/HEAD как статику → 405 Method Not Allowed.
    # Из-за этого не работала смена статуса преподавателя (активен/в
    # отпуске/на больничном/неактивен) в интерфейсе.
    location ~ ^/api/v1/auth {
        limit_req zone=api_auth burst=10 nodelay;
        limit_conn conn_perip 10;

        proxy_cookie_domain off;
        proxy_cookie_path / /;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Request-ID" always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Max-Age 3600 always;
        add_header Access-Control-Expose-Headers "X-Request-ID" always;
        add_header Vary "Origin" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass http://user-service:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/(users|branches|parents|tutors) {
        limit_req zone=api_general burst=40 nodelay;
        limit_conn conn_perip 20;

        proxy_cookie_domain off;
        proxy_cookie_path / /;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Request-ID" always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Max-Age 3600 always;
        add_header Access-Control-Expose-Headers "X-Request-ID" always;
        add_header Vary "Origin" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass http://user-service:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/academic {
        limit_req zone=api_general burst=40 nodelay;
        limit_conn conn_perip 20;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Request-ID" always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Max-Age 3600 always;
        add_header Access-Control-Expose-Headers "X-Request-ID" always;
        add_header Vary "Origin" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass http://academic-service:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/contracts {
        limit_req zone=api_general burst=40 nodelay;
        limit_conn conn_perip 20;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Request-ID" always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Max-Age 3600 always;
        add_header Access-Control-Expose-Headers "X-Request-ID" always;
        add_header Vary "Origin" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass http://contracts-service:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/crm {
        limit_req zone=api_general burst=40 nodelay;
        limit_conn conn_perip 20;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Request-ID" always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Max-Age 3600 always;
        add_header Access-Control-Expose-Headers "X-Request-ID" always;
        add_header Vary "Origin" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass http://crm-service:8084;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/(notifications|internal) {
        limit_req zone=api_general burst=40 nodelay;
        limit_conn conn_perip 20;
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Request-ID" always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Max-Age 3600 always;
        add_header Access-Control-Expose-Headers "X-Request-ID" always;
        add_header Vary "Origin" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass http://notification-service:8085;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------- Frontend static files ----------
    # /assets/* — файлы с хэшем в имени (Vite content-hash): раз сгенерированные,
    # никогда не меняются под тем же именем, поэтому кэшируем агрессивно и надолго.
    # Отдельно от location / и с try_files ... =404 (а не /index.html) — чтобы
    # запрос несуществующего чанка честно возвращал 404, а не HTML с mime text/html
    # (именно так ловится "Failed to load module script: ... text/html": после
    # передеплоя старый index.html из кэша браузера ссылается на удалённые файлы
    # прошлой сборки, и без этого правила nginx подсовывал на них SPA-фоллбэк).
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        limit_req zone=api_general burst=40 nodelay;

        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        # index.html не кэшируем вовсе — иначе браузер после деплоя новой сборки
        # ещё долго ходит по ссылкам на assets/* прошлой сборки, которых уже нет
        # на диске (см. комментарий выше).
        add_header Cache-Control "no-cache" always;
    }

    # ---------- Healthz ----------
    location /healthz {
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}
